<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SINGPERA — Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-login">
  <main class="login-shell">
    <header class="brand">
      <p class="brand-name">SINGPERA</p>
      <p class="brand-tag">Linux backup management console</p>
    </header>

    <form id="login-form" class="login-form" autocomplete="on">
      <label>
        Username
        <input type="text" name="username" id="username" required autofocus autocomplete="username" />
      </label>
      <label>
        Password
        <input type="password" name="password" id="password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" id="login-btn">Sign in with PAM</button>
    </form>

    <p class="hint">Uses your Linux system account (PAM). Any authenticated user can open the console.</p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
